name: Build CV PDFs

on:
  push:
    paths:
      - 'cv/*.tex'
      - 'cv/awesome-cv.cls'
      - 'cv/fonts/**'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

jobs:
  build-cv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq texlive-xetex texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra latexmk fonts-font-awesome
        timeout-minutes: 5

      - name: Compile CV PDFs
        run: |
          cd cv
          for source in cv.tex cv-research.tex; do
            xelatex -interaction=nonstopmode -halt-on-error "$source"
            xelatex -interaction=nonstopmode -halt-on-error "$source"
          done
        timeout-minutes: 5

      - name: Publish generated PDFs
        run: |
          cp cv/cv.pdf public/cv.pdf
          cp cv/cv.pdf cv.pdf
          cp cv/cv-research.pdf public/cv-recherche.pdf
          ls -lh cv/cv.pdf cv/cv-research.pdf public/cv.pdf public/cv-recherche.pdf

      - name: Commit PDFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: build CV PDFs from LaTeX sources'
          file_pattern: 'cv/cv.pdf public/cv.pdf public/cv-recherche.pdf cv.pdf'
          branch: ${{ github.head_ref || github.ref_name }}
